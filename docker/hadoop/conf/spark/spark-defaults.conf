# 默认把作业提交给 YARN，Driver 运行在提交命令的这个容器里（client 模式）
spark.master                     yarn
spark.submit.deployMode          client

# 资源：2 个 Executor，每个 1 核、1GB 内存。加上额外开销，总共约占 YARN 的 4GB
spark.driver.memory              1g
spark.executor.memory            1g
spark.executor.cores             1
spark.executor.instances         2
spark.yarn.am.memory             512m

# 使用提前上传到 HDFS 的 Spark 依赖包，避免每次提交都重新上传
spark.yarn.jars                  hdfs://hadoop:9000/spark/jars/*

# 表数据的默认存放位置（HDFS 上）
spark.sql.warehouse.dir          hdfs://hadoop:9000/user/hive/warehouse

# 第二步新增：使用 Hive 的元数据目录，并连接独立运行的 Hive Metastore 服务
spark.sql.catalogImplementation  hive
spark.hadoop.hive.metastore.uris thrift://metastore:9083

# 数据是纽约当地时间，会话时区设为纽约
spark.sql.session.timeZone       America/New_York
